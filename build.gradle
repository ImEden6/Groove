plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://cursemaven.com" }
	maven { url = "https://maven.ladysnake.org/releases" }
}

// Headless server tests in a real world, kept out of the mod jar
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/groove.accesswidener")
	runs {
		client {
			if (project.hasProperty('audioSmoke')) {
				vmArg '-Dgroove.audioSmoke=true'
				environmentVariable 'ALSOFT_DRIVERS', 'null'
			}
		}
		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
	}

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		"modid-gametest" {
			sourceSet sourceSets.gametest
		}
	}
}

dependencies {
	implementation project(':core-engine')
	include project(':core-engine')
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Trinkets: accessory-slot API backing the headphone item.
	modImplementation "curse.maven:trinkets-341284:5534317"
	// Trinkets' own runtime dependency. Fetched directly from Ladysnake's maven rather than
	// cursemaven's bundled master jar: Fabric Loader reads nested/jar-in-jar "jars" entries from
	// an actual jar file on disk, but Loom's dev-run classpath exposes mod dependencies as
	// unpacked directories, so the bundled base/entity modules never get discovered at dev time.
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.3"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.3"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.register('backendTest', JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.mervyn.groove.music.BackendTests'
}
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output
tasks.named('test') {
	dependsOn backendTest
	enabled = false // Executable regression suite, no JUnit dependency.
}
check.dependsOn backendTest
check.dependsOn 'runGametest'

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
