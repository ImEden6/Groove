plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }

tasks.register('engineTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'groove.engine.EngineTests'
}
check.dependsOn engineTest
tasks.register('liveTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'groove.engine.LiveTests'
}
check.dependsOn liveTest
tasks.register('sampleTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'groove.engine.SampleTests'
}
check.dependsOn sampleTest
// Opt-in long renders such as 20 s reverb decays, not part of check
tasks.register('longTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'groove.engine.ReverbLongTests'
}

tasks.register('perfBench', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'groove.engine.PerfBench'
    systemProperty 'perf.affinity', project.findProperty('perfAffinity') ?: ''
    systemProperty 'perf.only', project.findProperty('perfOnly') ?: ''
    jvmArgs = [
        '-Xms1g',
        '-Xmx1g',
        '-XX:+AlwaysPreTouch',
        '-Xlog:gc*:file=build/perfbench-gc.log:time,tags'
    ]
    doFirst {
        file('build').mkdirs()
    }
}

// This module uses an executable regression suite instead of a JUnit dependency.
tasks.named('test') {
    dependsOn engineTest, liveTest, sampleTest
    enabled = false
}

tasks.register('renderDemo', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'groove.engine.Demo'
    args layout.buildDirectory.file('demo.wav').get().asFile.absolutePath
}

tasks.register('renderSampleDemo', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'groove.engine.SampleDemo'
    args layout.buildDirectory.file('sample-demo.wav').get().asFile.absolutePath
}

tasks.register('renderSignalDemo', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'groove.engine.SignalDemo'
    args layout.buildDirectory.file('signal-demo.wav').get().asFile.absolutePath
}
